<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- OCP icon: round/layer node-graph with one highlighted trail. -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f77a8"/>
      <stop offset="1" stop-color="#1f5578"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#badge)"/>

  <!-- Graph edges (3x3 grid of nodes) -->
  <g stroke="#bcd6e8" stroke-width="2.8" opacity="0.55">
    <line x1="34" y1="38" x2="60" y2="38"/><line x1="60" y1="38" x2="86" y2="38"/>
    <line x1="34" y1="60" x2="60" y2="60"/><line x1="60" y1="60" x2="86" y2="60"/>
    <line x1="34" y1="82" x2="60" y2="82"/><line x1="60" y1="82" x2="86" y2="82"/>
    <line x1="34" y1="38" x2="60" y2="60"/><line x1="60" y1="38" x2="86" y2="60"/>
    <line x1="34" y1="60" x2="60" y2="82"/><line x1="60" y1="60" x2="86" y2="82"/>
    <line x1="34" y1="60" x2="60" y2="38"/><line x1="60" y1="82" x2="86" y2="60"/>
  </g>

  <!-- Highlighted trail -->
  <g stroke="#f0a94e" stroke-width="4" stroke-linecap="round">
    <line x1="34" y1="82" x2="60" y2="60"/><line x1="60" y1="60" x2="86" y2="38"/>
  </g>

  <!-- Nodes -->
  <g fill="#eaf2f8">
    <circle cx="34" cy="38" r="6"/><circle cx="60" cy="38" r="6"/><circle cx="86" cy="38" r="6"/>
    <circle cx="34" cy="60" r="6"/><circle cx="60" cy="60" r="6"/><circle cx="86" cy="60" r="6"/>
    <circle cx="34" cy="82" r="6"/><circle cx="60" cy="82" r="6"/><circle cx="86" cy="82" r="6"/>
  </g>
  <!-- Trail nodes highlighted -->
  <g fill="#f0a94e">
    <circle cx="34" cy="82" r="6.4"/><circle cx="60" cy="60" r="6.4"/><circle cx="86" cy="38" r="6.4"/>
  </g>
</svg>

<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">
  <!-- OCP logo: a round/layer node-graph with one highlighted trail, plus the wordmark. -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f77a8"/>
      <stop offset="1" stop-color="#1f5578"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="10" y="20" width="100" height="100" rx="22" fill="url(#badge)"/>

  <!-- Graph edges (3x3 grid of nodes) -->
  <g stroke="#bcd6e8" stroke-width="2.4" opacity="0.55">
    <line x1="34" y1="44" x2="60" y2="44"/><line x1="60" y1="44" x2="86" y2="44"/>
    <line x1="34" y1="70" x2="60" y2="70"/><line x1="60" y1="70" x2="86" y2="70"/>
    <line x1="34" y1="96" x2="60" y2="96"/><line x1="60" y1="96" x2="86" y2="96"/>
    <line x1="34" y1="44" x2="60" y2="70"/><line x1="60" y1="44" x2="86" y2="70"/>
    <line x1="34" y1="70" x2="60" y2="96"/><line x1="60" y1="70" x2="86" y2="96"/>
    <line x1="34" y1="70" x2="60" y2="44"/><line x1="60" y1="96" x2="86" y2="70"/>
  </g>

  <!-- Highlighted trail (SubBytes -> MixColumns path) -->
  <g stroke="#f0a94e" stroke-width="3.4" stroke-linecap="round">
    <line x1="34" y1="96" x2="60" y2="70"/><line x1="60" y1="70" x2="86" y2="44"/>
  </g>

  <!-- Nodes -->
  <g fill="#eaf2f8">
    <circle cx="34" cy="44" r="5.2"/><circle cx="60" cy="44" r="5.2"/><circle cx="86" cy="44" r="5.2"/>
    <circle cx="34" cy="70" r="5.2"/><circle cx="60" cy="70" r="5.2"/><circle cx="86" cy="70" r="5.2"/>
    <circle cx="34" cy="96" r="5.2"/><circle cx="60" cy="96" r="5.2"/><circle cx="86" cy="96" r="5.2"/>
  </g>
  <!-- Trail nodes highlighted -->
  <g fill="#f0a94e">
    <circle cx="34" cy="96" r="5.6"/><circle cx="60" cy="70" r="5.6"/><circle cx="86" cy="44" r="5.6"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="82" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#1f5578">OCP</text>
  <text x="134" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" letter-spacing="0.5" fill="#5a6b7a">Open Cryptanalysis Platform</text>
</svg>
